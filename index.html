<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22c55e" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>English Breakfast — Grammar</title>
    
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.svg" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rye&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="./assets/css/main.css?v=3.3" />
    
    <!-- Preload Level Cards for Instant Render -->
    <link rel="preload" as="image" type="image/webp" href="./assets/cards/card_a1.webp" />
    <link rel="preload" as="image" type="image/webp" href="./assets/cards/card_a2.webp" />
    <link rel="preload" as="image" type="image/webp" href="./assets/cards/card_b1.webp" />
    <link rel="preload" as="image" type="image/webp" href="./assets/cards/card_b1_b2.webp" />
    <link rel="preload" as="image" type="image/webp" href="./assets/cards/card_b2.webp" />
    <link rel="preload" as="image" type="image/webp" href="./assets/cards/card_c1.webp" />
    <link rel="preload" as="image" type="image/webp" href="./assets/cards/card_shorts.webp" />
    <link rel="preload" as="image" type="image/webp" href="./assets/cards/card_favorites.webp" />

    <script>
      // Global splash screen dismissal
      window.hideAppSplashScreen = function() {
        var splash = document.getElementById('app-splash-screen');
        if (splash) {
          splash.style.transition = 'opacity 0.3s ease, visibility 0.3s ease';
          splash.style.opacity = '0';
          splash.style.visibility = 'hidden';
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 350);
        }
      };

      // Safety fallback: auto-hide splash after 1 second if app took too long
      setTimeout(function() {
        if (window.hideAppSplashScreen) {
          window.hideAppSplashScreen();
        }
      }, 1000);
    </script>
  </head>

  <body>
    <div id="app"></div>

    <!-- Splash Screen with Mug -->
    <div id="app-splash-screen" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; z-index: 999999; font-family: 'Plus Jakarta Sans', sans-serif;">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; transform: translateY(-30px);">
        <div style="margin-bottom: 16px; width: 84px; height: 84px; animation: splashPulse 1.5s ease-in-out infinite; display: flex; align-items: center; justify-content: center;">
          <img src="./assets/icons/mug_icon.webp" alt="English Breakfast" style="width: 80px; height: 80px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.18));" />
        </div>
        <div style="font-size: 24px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px;">
          English <span style="background: linear-gradient(180deg, #fff2b2 0%, #ffd066 28%, #f59e0b 58%, #d97706 82%, #92400e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 850; display: inline-block;">Breakfast</span>
        </div>
        <div style="font-size: 13px; font-weight: 700; color: #64748b; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px;">
          Grammar
        </div>
        <div style="margin-top: 24px; width: 140px; height: 4px; background: #e2e8f0; border-radius: 4px; overflow: hidden;">
          <div style="width: 50%; height: 100%; background: #22c55e; border-radius: 4px; animation: splashLoading 1s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>

    <style>
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes splashLoading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
    </style>

    <script type="module" src="./app.js?v=4.1"></script>
  </body>
</html>
