<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22c55e" />
    <title>English Breakfast — Grammar</title>
    
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.svg" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="./assets/css/main.css" />

    <script>
      // Global splash screen dismissal
      window.hideAppSplashScreen = function() {
        var splash = document.getElementById('app-splash-screen');
        if (splash) {
          splash.style.transition = 'opacity 0.3s ease, visibility 0.3s ease';
          splash.style.opacity = '0';
          splash.style.visibility = 'hidden';
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 350);
        }
      };
    </script>
  </head>

  <body>
    <div id="app"></div>

    <!-- Splash Screen with Light-Green Cup -->
    <div id="app-splash-screen" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; z-index: 999999; font-family: 'Plus Jakarta Sans', sans-serif;">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; transform: translateY(-30px);">
        <div style="margin-bottom: 16px; width: 80px; height: 80px; animation: splashPulse 1.5s ease-in-out infinite;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 58" width="100%" height="100%">
            <!-- Steam in light-green -->
            <path d="M12,16 C7,12 17,8 12,4" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M22,16 C17,12 27,8 22,2" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M32,16 C27,12 37,8 32,4" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <!-- Green Cup -->
            <path d="M4,28 C4,46 12,54 22,54 C32,54 40,46 40,28 Z" fill="#22c55e"/>
            <path d="M40,32 C48,32 48,45 35,45" stroke="#22c55e" stroke-width="4.5" fill="none" stroke-linecap="round"/>
            <path d="M5,30 Q13.5,27 22,30 Q30.5,27 39,30 L39,20 Q30.5,17 22,20 Q13.5,17 5,20 Z" fill="#FFFFFF" stroke="#16a34a" stroke-width="1.8"/>
            <path d="M22,23 Q13.5,20 8,23" stroke="#22c55e" stroke-width="1.2" fill="none"/>
            <path d="M22,26 Q13.5,23 8,26" stroke="#22c55e" stroke-width="1.2" fill="none"/>
            <path d="M22,23 Q30.5,20 36,23" stroke="#22c55e" stroke-width="1.2" fill="none"/>
            <path d="M22,26 Q30.5,23 36,26" stroke="#22c55e" stroke-width="1.2" fill="none"/>
            <line x1="22" y1="20" x2="22" y2="30" stroke="#16a34a" stroke-width="1.8"/>
            <text x="22" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">EN</text>
          </svg>
        </div>
        <div style="font-size: 22px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px;">
          English <span style="color: #22c55e;">Breakfast</span>
        </div>
        <div style="font-size: 13px; font-weight: 700; color: #64748b; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px;">
          Grammar Master
        </div>
        <div style="margin-top: 24px; width: 140px; height: 4px; background: #e2e8f0; border-radius: 4px; overflow: hidden;">
          <div style="width: 50%; height: 100%; background: #22c55e; border-radius: 4px; animation: splashLoading 1s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>

    <style>
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes splashLoading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
    </style>

    <script type="module" src="./app.js"></script>
  </body>
</html>
