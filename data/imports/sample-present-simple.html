<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body>

<h1>Present Simple</h1>
<p class="lesson-meta">Level: A1</p>

<!-- Exercise 1 -->
<div id="quiz-101" class="quiz-content">
  <h2>Exercise 1</h2>
  <p class="exercise-instruction">Choose the correct form of the verb.</p>

  <ul>
    <!-- Question 1: 2 gaps -->
    <li id="question-1001" class="question">
      <p>A: <select data-gap="1">
        <option value="">---</option>
        <option value="Are" data-correct="1">Are</option>
        <option value="Is">Is</option>
        <option value="Am">Am</option>
      </select> you a teacher?
      B: Yes, I <select data-gap="2">
        <option value="">---</option>
        <option value="am" data-correct="1">am</option>
        <option value="are">are</option>
        <option value="is">is</option>
      </select>.</p>
    </li>

    <!-- Question 2: 1 gap -->
    <li id="question-1002" class="question">
      <p>She <select data-gap="1">
        <option value="">---</option>
        <option value="work">work</option>
        <option value="works" data-correct="1">works</option>
        <option value="working">working</option>
      </select> in a hospital.</p>
    </li>

    <!-- Question 3: 1 gap -->
    <li id="question-1003" class="question">
      <p>They <select data-gap="1">
        <option value="">---</option>
        <option value="don't" data-correct="1">don't</option>
        <option value="doesn't">doesn't</option>
        <option value="isn't">isn't</option>
      </select> like coffee.</p>
    </li>

    <!-- Question 4: 3 gaps -->
    <li id="question-1004" class="question">
      <p><select data-gap="1">
        <option value="">---</option>
        <option value="Do" data-correct="1">Do</option>
        <option value="Does">Does</option>
        <option value="Is">Is</option>
      </select> you <select data-gap="2">
        <option value="">---</option>
        <option value="speak" data-correct="1">speak</option>
        <option value="speaks">speaks</option>
        <option value="speaking">speaking</option>
      </select> English? — Yes, I <select data-gap="3">
        <option value="">---</option>
        <option value="do" data-correct="1">do</option>
        <option value="does">does</option>
        <option value="don't">don't</option>
      </select>.</p>
    </li>
  </ul>
</div>

<!-- Exercise 2 -->
<div id="quiz-102" class="quiz-content">
  <h2>Exercise 2</h2>
  <p class="exercise-instruction">Choose the correct answer.</p>

  <ul>
    <!-- Question 5: single choice -->
    <li id="question-1005" class="question">
      <p>Which sentence is correct?</p>
      <ul class="answers">
        <li><input type="radio" name="q1005" id="q1005a" value="She work every day." data-correct="0"><label for="q1005a">She work every day.</label></li>
        <li><input type="radio" name="q1005" id="q1005b" value="She works every day." data-correct="1"><label for="q1005b">She works every day.</label></li>
        <li><input type="radio" name="q1005" id="q1005c" value="She is work every day." data-correct="0"><label for="q1005c">She is work every day.</label></li>
      </ul>
    </li>

    <!-- Question 6: single choice -->
    <li id="question-1006" class="question">
      <p>Which question is correct?</p>
      <ul class="answers">
        <li><input type="radio" name="q1006" id="q1006a" value="Do he play tennis?" data-correct="0"><label for="q1006a">Do he play tennis?</label></li>
        <li><input type="radio" name="q1006" id="q1006b" value="Does he plays tennis?" data-correct="0"><label for="q1006b">Does he plays tennis?</label></li>
        <li><input type="radio" name="q1006" id="q1006c" value="Does he play tennis?" data-correct="1"><label for="q1006c">Does he play tennis?</label></li>
      </ul>
    </li>
  </ul>
</div>
